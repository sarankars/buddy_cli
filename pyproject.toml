[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "buddy-cli"
version = "0.2.1"
description = "Enhance rough prompts before sending them to an AI assistant."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "zstandard>=0.23,<1",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.16,<7",
]

[project.scripts]
buddy = "buddy_cli.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "SIM"]
