name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    outputs:
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      version: ${{ steps.metadata.outputs.version }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Validate semantic version and Cargo.toml version
        id: metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cargo_version=$(grep '^version' Cargo.toml | head -n 1 | sed 's/version = "\(.*\)"/\1/')
          tag_version="${RELEASE_TAG#v}"
          if [ "$cargo_version" != "$tag_version" ]; then
            echo "Version mismatch: Cargo.toml=$cargo_version, tag=$tag_version" >&2
            exit 1
          fi
          if echo "$tag_version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$tag_version" >> "$GITHUB_OUTPUT"

  quality:
    name: Complete quality suite
    needs: validate
    uses: ./.github/workflows/tests.yml

  build:
    name: ${{ matrix.target }}
    needs:
      - validate
      - quality
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-x64
            runner: macos-15-intel
            rust-target: x86_64-apple-darwin
            archive: release/buddy-macos-x64.pkg
          - target: macos-arm64
            runner: macos-15
            rust-target: aarch64-apple-darwin
            archive: release/buddy-macos-arm64.pkg
          - target: windows-x64
            runner: windows-2025
            rust-target: x86_64-pc-windows-msvc
            archive: release/buddy-windows-x64.zip
          - target: windows-arm64
            runner: windows-11-arm
            rust-target: aarch64-pc-windows-msvc
            archive: release/buddy-windows-arm64.zip
          - target: linux-x64
            runner: ubuntu-24.04
            rust-target: x86_64-unknown-linux-musl
            archive: release/buddy-linux-x64.tar.gz
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            rust-target: aarch64-unknown-linux-musl
            archive: release/buddy-linux-arm64.tar.gz

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Cache Cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-${{ matrix.rust-target }}-cargo-registry-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.rust-target }}-cargo-registry-

      - name: Cache build outputs
        uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-${{ matrix.rust-target }}-cargo-build-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.rust-target }}-cargo-build-

      - name: Install musl tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y musl-tools

      - name: Show build platform
        run: rustc --print target-spec-json --target ${{ matrix.rust-target }} || rustc --version

      - name: Import Apple Developer ID certificates
        if: runner.os == 'macOS'
        env:
          APP_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          APP_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          INSTALLER_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_P12_BASE64 }}
          INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_P12_PASSWORD }}
        run: |
          for required in \
            APP_CERTIFICATE_BASE64 \
            APP_CERTIFICATE_PASSWORD \
            INSTALLER_CERTIFICATE_BASE64 \
            INSTALLER_CERTIFICATE_PASSWORD
          do
            if [ -z "${!required}" ]; then
              echo "Required Apple signing secret is missing: $required" >&2
              exit 1
            fi
          done

          app_certificate_path="$RUNNER_TEMP/developer-id-application.p12"
          installer_certificate_path="$RUNNER_TEMP/developer-id-installer.p12"
          keychain_path="$RUNNER_TEMP/buddy-signing.keychain-db"
          keychain_password=$(openssl rand -base64 32)

          printf '%s' "$APP_CERTIFICATE_BASE64" | \
            base64 --decode -o "$app_certificate_path"
          printf '%s' "$INSTALLER_CERTIFICATE_BASE64" | \
            base64 --decode -o "$installer_certificate_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$app_certificate_path" \
            -P "$APP_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 \
            -k "$keychain_path"
          security import "$installer_certificate_path" \
            -P "$INSTALLER_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 \
            -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$keychain_password" "$keychain_path"
          security list-keychain -d user -s "$keychain_path"

          application_identity=$(security find-certificate \
            -c "Developer ID Application" -p "$keychain_path" | \
            openssl x509 -noout -subject -nameopt multiline | \
            sed -n 's/^[[:space:]]*commonName[[:space:]]*=[[:space:]]*//p' | \
            head -n 1)
          installer_identity=$(security find-certificate \
            -c "Developer ID Installer" -p "$keychain_path" | \
            openssl x509 -noout -subject -nameopt multiline | \
            sed -n 's/^[[:space:]]*commonName[[:space:]]*=[[:space:]]*//p' | \
            head -n 1)
          if [ -z "$application_identity" ] || [ -z "$installer_identity" ]; then
            echo "Imported certificates do not contain both Developer ID identities" >&2
            exit 1
          fi
          {
            echo "APPLE_APPLICATION_IDENTITY=$application_identity"
            echo "APPLE_INSTALLER_IDENTITY=$installer_identity"
          } >> "$GITHUB_ENV"

      - name: Build release binary (macOS — with codesign)
        if: runner.os == 'macOS'
        run: |
          cargo build --release --target ${{ matrix.rust-target }}
          codesign --force \
            --sign "$APPLE_APPLICATION_IDENTITY" \
            --options runtime \
            --timestamp \
            "target/${{ matrix.rust-target }}/release/buddy"

      - name: Build release binary
        if: runner.os != 'macOS'
        run: cargo build --release --target ${{ matrix.rust-target }}

      - name: Verify and smoke-test signed macOS executable
        if: runner.os == 'macOS'
        run: |
          codesign --verify --deep --strict --verbose=4 \
            target/${{ matrix.rust-target }}/release/buddy
          target/${{ matrix.rust-target }}/release/buddy --version

      - name: Smoke-test executable (non-macOS)
        if: runner.os != 'macOS'
        shell: bash
        run: |
          bin="target/${{ matrix.rust-target }}/release/buddy"
          [[ "${{ runner.os }}" == "Windows" ]] && bin="${bin}.exe"
          "$bin" --version

      - name: Package macOS installer
        if: runner.os == 'macOS'
        run: >-
          bash scripts/package_macos_installer.sh
          --target "${{ matrix.target }}"
          --version "${{ needs.validate.outputs.version }}"
          --signing-identity "$APPLE_INSTALLER_IDENTITY"
          --binary "target/${{ matrix.rust-target }}/release/buddy"

      - name: Verify macOS installer signature
        if: runner.os == 'macOS'
        run: pkgutil --check-signature "${{ matrix.archive }}"

      - name: Notarize macOS installer
        if: runner.os == 'macOS'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          for required in APPLE_ID APPLE_TEAM_ID APPLE_APP_SPECIFIC_PASSWORD
          do
            if [ -z "${!required}" ]; then
              echo "Required Apple notarization secret is missing: $required" >&2
              exit 1
            fi
          done

          result_path="$RUNNER_TEMP/notary-result.json"
          xcrun notarytool submit "${{ matrix.archive }}" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait \
            --output-format json > "$result_path"
          cat "$result_path"

          submission_id=$(jq -r '.id' "$result_path")
          status=$(jq -r '.status' "$result_path")
          if [ "$status" != "Accepted" ]; then
            echo "Apple notarization did not succeed: $status" >&2
            exit 1
          fi

          log_path="$RUNNER_TEMP/notary-log.json"
          xcrun notarytool log "$submission_id" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            "$log_path"
          cat "$log_path"
          if [[ "$(jq '.issues // [] | length' "$log_path")" -ne 0 ]]; then
            echo "Apple notarization log contains issues" >&2
            exit 1
          fi

      - name: Staple and assess macOS installer
        if: runner.os == 'macOS'
        run: |
          xcrun stapler staple -v "${{ matrix.archive }}"
          xcrun stapler validate -v "${{ matrix.archive }}"
          pkgutil --check-signature "${{ matrix.archive }}"
          spctl --assess --type install --verbose=4 "${{ matrix.archive }}"
          archive="${{ matrix.archive }}"
          name="$(basename "$archive")"
          digest=$(shasum -a 256 "$archive" | awk '{print $1}')
          printf '%s  %s\n' "$digest" "$name" > "${archive}.sha256"

      - name: Package and checksum executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = "target\${{ matrix.rust-target }}\release\buddy.exe"
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path $bin -DestinationPath "${{ matrix.archive }}" -Force
          $hash = (Get-FileHash -Algorithm SHA256 "${{ matrix.archive }}").Hash.ToLower()
          $name = [System.IO.Path]::GetFileName("${{ matrix.archive }}")
          "$hash  $name" | Set-Content "${{ matrix.archive }}.sha256" -Encoding ascii

      - name: Package and checksum executable (Linux)
        if: runner.os == 'Linux'
        run: |
          bin="target/${{ matrix.rust-target }}/release/buddy"
          mkdir -p release
          tar -czf "${{ matrix.archive }}" -C "$(dirname $bin)" buddy
          name="$(basename "${{ matrix.archive }}")"
          digest=$(sha256sum "${{ matrix.archive }}" | awk '{print $1}')
          printf '%s  %s\n' "$digest" "$name" > "${{ matrix.archive }}.sha256"

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: buddy-${{ matrix.target }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs:
      - validate
      - quality
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Download every platform artifact
        uses: actions/download-artifact@v8
        with:
          pattern: buddy-*
          path: release-assets
          merge-multiple: true

      - name: Verify release assets and checksums
        run: bash scripts/verify_release_assets.sh release-assets

      - name: Publish stable release
        if: needs.validate.outputs.prerelease == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* \
            --verify-tag \
            --generate-notes

      - name: Publish prerelease
        if: needs.validate.outputs.prerelease == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* \
            --verify-tag \
            --generate-notes \
            --prerelease \
            --latest=false
