name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    outputs:
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      version: ${{ steps.metadata.outputs.version }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Validate semantic version and project version
        id: metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          project_version=$(PYTHONPATH=src python -c "from buddy_cli import __version__; print(__version__)")
          package_version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$project_version" != "$package_version" ]; then
            echo "Version mismatch: __version__=$project_version, pyproject.toml=$package_version" >&2
            exit 1
          fi
          python scripts/release_metadata.py "$RELEASE_TAG" \
            --project-version "$project_version" >> "$GITHUB_OUTPUT"

  quality:
    name: Complete quality suite
    needs: validate
    uses: ./.github/workflows/tests.yml

  build:
    name: ${{ matrix.target }}
    needs:
      - validate
      - quality
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-x64
            runner: macos-15-intel
            python-architecture: x64
            archive: release/buddy-macos-x64.tar.gz
          - target: macos-arm64
            runner: macos-15
            python-architecture: arm64
            archive: release/buddy-macos-arm64.tar.gz
          - target: windows-x64
            runner: windows-2025
            python-architecture: x64
            archive: release/buddy-windows-x64.zip
          - target: windows-arm64
            runner: windows-11-arm
            python-architecture: arm64
            archive: release/buddy-windows-arm64.zip
          - target: linux-x64
            runner: ubuntu-24.04
            python-architecture: x64
            archive: release/buddy-linux-x64.tar.gz
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            python-architecture: arm64
            archive: release/buddy-linux-arm64.tar.gz

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          architecture: ${{ matrix.python-architecture }}
          cache: pip

      - name: Install build dependencies
        run: python -m pip install --editable ".[build]"

      - name: Show build platform
        run: python -c "import platform; print(platform.platform(), platform.machine())"

      - name: Build standalone executable
        run: python scripts/build_standalone.py

      - name: Smoke-test executable
        run: python scripts/package_standalone.py --target ${{ matrix.target }} --smoke-test

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: buddy-${{ matrix.target }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs:
      - validate
      - quality
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Download every platform artifact
        uses: actions/download-artifact@v8
        with:
          pattern: buddy-*
          path: release-assets
          merge-multiple: true

      - name: Verify release assets and checksums
        run: python scripts/verify_release_assets.py release-assets

      - name: Publish stable release
        if: needs.validate.outputs.prerelease == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* \
            --verify-tag \
            --generate-notes

      - name: Publish prerelease
        if: needs.validate.outputs.prerelease == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* \
            --verify-tag \
            --generate-notes \
            --prerelease \
            --latest=false
