name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    outputs:
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      version: ${{ steps.metadata.outputs.version }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Validate semantic version and project version
        id: metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          project_version=$(PYTHONPATH=src python -c "from buddy_cli import __version__; print(__version__)")
          package_version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$project_version" != "$package_version" ]; then
            echo "Version mismatch: __version__=$project_version, pyproject.toml=$package_version" >&2
            exit 1
          fi
          python scripts/release_metadata.py "$RELEASE_TAG" \
            --project-version "$project_version" >> "$GITHUB_OUTPUT"

  quality:
    name: Complete quality suite
    needs: validate
    uses: ./.github/workflows/tests.yml

  build:
    name: ${{ matrix.target }}
    needs:
      - validate
      - quality
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-x64
            runner: macos-15-intel
            python-architecture: x64
            archive: release/buddy-macos-x64.pkg
          - target: macos-arm64
            runner: macos-15
            python-architecture: arm64
            archive: release/buddy-macos-arm64.pkg
          - target: windows-x64
            runner: windows-2025
            python-architecture: x64
            archive: release/buddy-windows-x64.zip
          - target: windows-arm64
            runner: windows-11-arm
            python-architecture: arm64
            archive: release/buddy-windows-arm64.zip
          - target: linux-x64
            runner: ubuntu-24.04
            python-architecture: x64
            archive: release/buddy-linux-x64.tar.gz
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            python-architecture: arm64
            archive: release/buddy-linux-arm64.tar.gz

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          architecture: ${{ matrix.python-architecture }}
          cache: pip

      - name: Install build dependencies
        run: python -m pip install --editable ".[build]"

      - name: Show build platform
        run: python -c "import platform; print(platform.platform(), platform.machine())"

      - name: Import Apple Developer ID certificates
        if: runner.os == 'macOS'
        env:
          APP_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          APP_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          INSTALLER_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_P12_BASE64 }}
          INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_P12_PASSWORD }}
        run: |
          for required in \
            APP_CERTIFICATE_BASE64 \
            APP_CERTIFICATE_PASSWORD \
            INSTALLER_CERTIFICATE_BASE64 \
            INSTALLER_CERTIFICATE_PASSWORD
          do
            if [ -z "${!required}" ]; then
              echo "Required Apple signing secret is missing: $required" >&2
              exit 1
            fi
          done

          app_certificate_path="$RUNNER_TEMP/developer-id-application.p12"
          installer_certificate_path="$RUNNER_TEMP/developer-id-installer.p12"
          keychain_path="$RUNNER_TEMP/buddy-signing.keychain-db"
          keychain_password=$(openssl rand -base64 32)

          printf '%s' "$APP_CERTIFICATE_BASE64" | \
            base64 --decode -o "$app_certificate_path"
          printf '%s' "$INSTALLER_CERTIFICATE_BASE64" | \
            base64 --decode -o "$installer_certificate_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$app_certificate_path" \
            -P "$APP_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 \
            -k "$keychain_path"
          security import "$installer_certificate_path" \
            -P "$INSTALLER_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 \
            -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$keychain_password" "$keychain_path"
          security list-keychain -d user -s "$keychain_path"

          application_identity=$(security find-certificate \
            -c "Developer ID Application" -p "$keychain_path" | \
            openssl x509 -noout -subject -nameopt multiline | \
            sed -n 's/^[[:space:]]*commonName[[:space:]]*=[[:space:]]*//p' | \
            head -n 1)
          installer_identity=$(security find-certificate \
            -c "Developer ID Installer" -p "$keychain_path" | \
            openssl x509 -noout -subject -nameopt multiline | \
            sed -n 's/^[[:space:]]*commonName[[:space:]]*=[[:space:]]*//p' | \
            head -n 1)
          if [ -z "$application_identity" ] || [ -z "$installer_identity" ]; then
            echo "Imported certificates do not contain both Developer ID identities" >&2
            exit 1
          fi
          {
            echo "APPLE_APPLICATION_IDENTITY=$application_identity"
            echo "APPLE_INSTALLER_IDENTITY=$installer_identity"
          } >> "$GITHUB_ENV"

      - name: Build signed macOS executable
        if: runner.os == 'macOS'
        run: >-
          python scripts/build_standalone.py
          --codesign-identity "$APPLE_APPLICATION_IDENTITY"

      - name: Build standalone executable
        if: runner.os != 'macOS'
        run: python scripts/build_standalone.py

      - name: Verify and smoke-test signed macOS executable
        if: runner.os == 'macOS'
        run: |
          codesign --verify --deep --strict --verbose=4 dist/buddy
          codesign --display --verbose=4 dist/buddy
          ./dist/buddy --version

      - name: Package signed macOS installer
        if: runner.os == 'macOS'
        run: >-
          python scripts/package_macos_installer.py
          --target "${{ matrix.target }}"
          --version "${{ needs.validate.outputs.version }}"
          --signing-identity "$APPLE_INSTALLER_IDENTITY"

      - name: Verify macOS installer signature
        if: runner.os == 'macOS'
        run: pkgutil --check-signature "${{ matrix.archive }}"

      - name: Notarize macOS installer
        if: runner.os == 'macOS'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          for required in APPLE_ID APPLE_TEAM_ID APPLE_APP_SPECIFIC_PASSWORD
          do
            if [ -z "${!required}" ]; then
              echo "Required Apple notarization secret is missing: $required" >&2
              exit 1
            fi
          done

          result_path="$RUNNER_TEMP/notary-result.json"
          xcrun notarytool submit "${{ matrix.archive }}" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait \
            --output-format json > "$result_path"
          cat "$result_path"

          submission_id=$(python -c \
            "import json; print(json.load(open('$result_path'))['id'])")
          status=$(python -c \
            "import json; print(json.load(open('$result_path'))['status'])")
          if [ "$status" != "Accepted" ]; then
            echo "Apple notarization did not succeed: $status" >&2
            exit 1
          fi

          log_path="$RUNNER_TEMP/notary-log.json"
          xcrun notarytool log "$submission_id" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            "$log_path"
          cat "$log_path"
          python - "$log_path" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              issues = json.load(handle).get("issues") or []
          if issues:
              raise SystemExit("Apple notarization log contains issues")
          PY

      - name: Staple and assess macOS installer
        if: runner.os == 'macOS'
        run: |
          xcrun stapler staple -v "${{ matrix.archive }}"
          xcrun stapler validate -v "${{ matrix.archive }}"
          pkgutil --check-signature "${{ matrix.archive }}"
          spctl --assess --type install --verbose=4 "${{ matrix.archive }}"
          python scripts/checksum.py "${{ matrix.archive }}"

      - name: Smoke-test and package executable
        if: runner.os != 'macOS'
        run: python scripts/package_standalone.py --target ${{ matrix.target }} --smoke-test

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: buddy-${{ matrix.target }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs:
      - validate
      - quality
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Download every platform artifact
        uses: actions/download-artifact@v8
        with:
          pattern: buddy-*
          path: release-assets
          merge-multiple: true

      - name: Verify release assets and checksums
        run: python scripts/verify_release_assets.py release-assets

      - name: Publish stable release
        if: needs.validate.outputs.prerelease == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* \
            --verify-tag \
            --generate-notes

      - name: Publish prerelease
        if: needs.validate.outputs.prerelease == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* \
            --verify-tag \
            --generate-notes \
            --prerelease \
            --latest=false
